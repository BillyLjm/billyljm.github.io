{% comment %}
  Initial theme = prefers-color-scheme (before paint).
  Optional same-tab override after the user toggles: sessionStorage "theme-session-v1".
  Must stay inline and in <head>. Paired with assets/js/theme.js.
{% endcomment %}
<script>
(function () {
  try {
    // Drop the old permanent preference key if present.
    try { localStorage.removeItem("theme-v1"); } catch (e) {}

    var override = null;
    try { override = sessionStorage.getItem("theme-session-v1"); } catch (e) {}

    var t =
      override === "light" || override === "dark"
        ? override
        : window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "light");
  }
})();
</script>
