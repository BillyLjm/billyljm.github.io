<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} · {{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
    {% include theme-boot.html %}
  </head>
  <body class="site-page">
    {% include site-menu.html %}
    <main id="main" class="page-main">
      <div class="container prose">
        <p class="eyebrow">{{ page.title }}</p>
        <h1>{{ page.title }}</h1>
        {% if page.description %}
        <p class="lead">{{ page.description }}</p>
        {% endif %}
        {{ content }}
      </div>
    </main>
    <footer class="site-footer">
      <div class="container footer-inner">
        <p><a href="{{ "/" | relative_url }}">← Back to {{ site.title }}</a></p>
      </div>
    </footer>
    <script src="{{ "/assets/js/theme.js" | relative_url }}" defer></script>
    <script src="{{ "/assets/js/menu.js" | relative_url }}" defer></script>
  </body>
</html>
